# yunsu-45.conf — 给 45 号机器(client bed)调用的配置
# SSH 目标改为 45(keyless /root/.ssh/id_ed25519), 不装 hyst2 服务端相关字段

# --- 1. 服务端(VPS, 跑 sing-box hyst2) -> 对 45 本身执行 ---
H2N_SSH_HOST="45.62.110.201"
H2N_SSH_PORT="5004"
H2N_SSH_KEY="/root/.ssh/id_ed25519"
H2N_SSH_USER="root"
H2N_SSH_BIN="ssh"

# --- 2. 测试床(同机房邻居机, 做隧道吞吐基准) -> 同为 45 本身 ---
H2N_TB_HOST="45.62.110.201"
H2N_TB_PORT="5004"
H2N_TB_KEY="/root/.ssh/id_ed25519"
H2N_TB_USER="root"

# --- 3. hyst2 服务端参数(45 是客户端, 不此执行) ---
H2N_H2_PORT=""
H2N_H2_DOMAIN=""
H2N_H2_CERT_DIR=""
H2N_H2_BBR_PROFILE=""
H2N_H2_MASQUERADE=""
H2N_H2_PASSWORD_FILE=""    # 关键: 留空, 推荐时跳过服务端字段
H2N_H2_LOG_LEVEL=""

# --- 4. sysctl 持久化层(通用, 45 也适用) ---
H2N_SYSCTL_CONF="/etc/sysctl.d/90-netopt.conf"
H2N_SYSCTL_MARKER="# BEGIN hyst2-netopt"

# --- 5. 测试床参数(复用, 同机房) ---
H2N_TB_PROXY_PORT="7890"
H2N_TB_FILESERV_PORT="8890"
H2N_TB_FILE_MB="200"
H2N_TB_TEST_MB="100"
H2N_TB_RUNS="3"
H2N_TB_CONCURRENCY="4"

# --- 6. 本地代理口(可选) ---
H2N_LOCAL_PROXY_PORT="7890"
H2N_TLS_ENABLED="0"         # 45 无 TLS 域名, 不用 TLS
